<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Fake News Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&display=swap" rel="stylesheet">
  <style>
    *{
      box-sizing: border-box;
    }
    body{
      margin: 0;
      padding: 0;
      height: 100vh;
      /* background: url('https://img.freepik.com/premium-photo/vintage-newspaper-collage-background-old-newspapers-textured-backdrop-historical-themes_656098-1047.jpg?w=2000') no-repeat center center fixed; */
      /* background-size: cover;
      box-sizing: border-box; */
      background:rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI',sans-serif;
      }
   .login{                  
        background:rgba(0,0,0,0.5);
        padding: 40px 30px;
        border-radius:20px;
        width: 100%;
        max-width: 420px;
        backdrop-filter: blur(5px);
        box-shadow: 0 0 25px #f5efd6;
        text-align:center;
      }
    .login h2{
        color:rgb(255, 255, 255);
        margin-bottom: 20px;
        font-size: 30px;
        border-radius: 5px;
        padding: 12px;
      }
    .login input[type="text"],
    .login input[type="password"]{
        width: 100%;
        border-radius: 20px;
        margin-bottom: 10px;
        padding:12px;
        border: none;
        color: rgb(27, 11, 11);
        font: 14px;
        box-shadow:0 0 6px #e0cd7f;
        outline: none;
        font-size: 14px;
      } 
    .login button{
        border-radius: 10px;
        border: none;
        width: 100%;
        padding: 12px;
        cursor: pointer;
        font-size: 16px;
        background: linear-gradient(to right,#fbf9ef,#e0cd7f);
        transition: transform 0.3s;
        color: brown;
        box-shadow: 0 0 6px pink;
      }
    .login p{
        color: white;
        font-size: 14px;
        margin-top: 20px;
        text-align: center;
      }
    .login a{
        text-decoration: none;
        color:rgb(26, 134, 228);
      }
    .login a:hover{
        text-decoration: underline;
      }
   .error {
     color: #c0392b;
     margin-bottom: 10px;
     font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login">
    <h2>🔐 Login - Fake News Detector</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <input type="text" name="username" placeholder="Enter username" required />
      <input type="password" name="password" placeholder="Enter password" required />
      <button type="submit">Login</button>
    </form>
    <p> Don't have an account? <a href="/register">Register here</a></p>
  </div>
</body>
</html>
